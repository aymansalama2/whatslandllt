<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="alternate icon" type="image/jpg" href="/WhatsApp Image 2025-07-10 à 16.19.00_31d3e4f3.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsLand - Connectivité sans frontières</title>
    
    <!-- Enhanced polyfill for browser compatibility - Must be first -->
    <script>
      // Polyfill pour documentPictureInPicture - Défini immédiatement
      (function() {
        if (typeof window.documentPictureInPicture === 'undefined') {
          console.log('📱 Ajout du polyfill documentPictureInPicture');
          window.documentPictureInPicture = {
            requestWindow: function() {
              return Promise.reject(new Error('Picture-in-Picture non supporté'));
            }
          };
          
          // Aussi définir sur l'objet global pour la compatibilité
          if (typeof globalThis !== 'undefined') {
            globalThis.documentPictureInPicture = window.documentPictureInPicture;
          }
        }
      })();
      
      // Enhanced error handling for compatibility
      const originalConsoleError = console.error;
      console.error = function(...args) {
        const message = args.join(' ');
        
        // Filter non-critical errors
        if (message.includes('documentPictureInPicture') ||
            (message.includes('MetaMask') && 
             (message.includes('extension not found') || 
              message.includes('Failed to connect')))) {
          console.warn('⚠️ Non-critical error ignored:', message);
          return;
        }
        
        originalConsoleError.apply(console, args);
      };
      
      console.log('✅ Correctifs de compatibilité appliqués');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
